; Phoca Cart POS Discount (system plugin) - English (en-GB), system strings
PLG_SYSTEM_PHOCACARTPOSDISCOUNT="System - Phoca Cart POS Discount"
PLG_SYSTEM_PHOCACARTPOSDISCOUNT_XML_DESCRIPTION="Lets selected staff give a manual discount, a flat amount or a percentage, on the Phoca Cart POS Apply Benefits screen. The discount is applied through Phoca Cart's own coupon engine, so it is spread across the basket and stored in the order, totals, tax recapitulation and receipt like any other coupon. Nobody can discount until you choose groups or users on the Access tab."
